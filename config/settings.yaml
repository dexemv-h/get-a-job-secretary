# ──────────────────────────────────────────────
# Stage 1: 공고 필터 설정
# ──────────────────────────────────────────────
job_filter:
  # 통과시킬 지역 (이 목록에 포함된 단어가 지역명에 있으면 통과)
  allowed_locations:
    - 서울
    - 판교
    - 성남
    - 분당
    - 강남
    - 종로
    - 마포
    - 여의도

  # 타겟 직무 키워드 (제목/직무명에 하나라도 포함되면 1차 통과)
  target_roles:
    - PM
    - 프로덕트 매니저
    - Product Manager
    - PO
    - 프로덕트 오너
    - 기획자
    - 서비스 기획

  # 제외 키워드 (제목에 하나라도 포함되면 바로 제외)
  exclude_keywords:
    - 코딩테스트 필수
    - 교대근무
    - 생산직
    - 제조
    - 운전
    - 인턴
    - 아르바이트
    - 파트타임
    - 야간

  # 최소 경력 (년). 공고에 명시된 최대 경력 요건이 이 값보다 크면 제외
  max_required_experience_years: 5

# ──────────────────────────────────────────────
# Stage 2: 자소서 채점 설정
# ──────────────────────────────────────────────
cover_letter:
  pass_score: 88          # 이 점수 이상이면 제출 가능
  max_iterations: 5       # 최대 채점-수정 반복 횟수
  model: claude-opus-4-7

  # 100점 기준표 (항목별 배점)
  scoring_rubric:
    # 글 품질 (50점)
    - id: core_first_sentence
      name: 핵심이 첫 문장에
      max_score: 15
    - id: numbers_present
      name: 수치/숫자 존재
      max_score: 15
    - id: no_ai_tone
      name: AI투 없음
      max_score: 10
      # "활용할 수 있습니다", "하도록 하겠습니다", "기여할 수 있을 것입니다" 등
    - id: conciseness
      name: 불필요한 미사여구 없음
      max_score: 10

    # 직무 적합성 (50점)
    - id: jd_keyword_coverage
      name: 공고 요구 역량 커버
      max_score: 20
    - id: experience_link
      name: 내 경험과 직무 연결
      max_score: 20
    - id: company_fit
      name: 회사 맥락 반영
      max_score: 10

  # 개인 체크리스트 (제출 전 최종 확인)
  personal_checklist:
    - 가운뎃점(·) 미사용
    - '"활용할 수 있습니다" 문구 없음'
    - '"하도록 하겠습니다" 문구 없음'
    - 한 문단 최대 5줄
    - 글자 수 공고 기준 ±10% 이내

# ──────────────────────────────────────────────
# Stage 4: 면접 코치 설정
# ──────────────────────────────────────────────
interview_coach:
  model: claude-opus-4-7
  personality_questions: 10
  technical_questions: 10

  # 4단 답변 구조 채점 기준
  answer_rubric:
    - id: metric
      name: 지표 명시
      max_score: 25
    - id: value
      name: 수치 값 존재
      max_score: 25
    - id: action_basis
      name: 행동/근거 (책임 나열 아닌 실제 행동)
      max_score: 25
    - id: result
      name: 결과 명시
      max_score: 25

  answer_time_limit_seconds: 60   # 적정 답변 시간 (초)

# ──────────────────────────────────────────────
# Stage 6: OPIc 등급 예측 / 캘리브레이션 설정
# ──────────────────────────────────────────────
opic_coach:
  model: claude-opus-4-7

  # 시험 전체 등급을 확정하기 위해 필요한 최소 답변 수.
  # 이보다 적으면 "판단 보류"로만 출력한다.
  min_answers_for_overall: 5

  # Floor 판정: 이 비율 이상의 답변이 하한으로 도달해야 Floor로 인정
  floor_ratio: 0.7

  # 한 답변이 "Advanced 기능 성공"으로 카운트되는 기준 (0~1)
  # 안정=1.0 / 부분적=0.5 / 부족=0.0 의 평균이 이 값 이상
  advanced_success_threshold: 0.7

  # Advanced 기능 성공률이 이 값 이상이고 Floor가 IH 이상이면 AL 후보
  al_advanced_success_ratio: 0.8

  # Advanced 기능으로 카운트할 항목
  advanced_functions:
    - text_type
    - time_frame
    - narration
    - description
    - complication_handling

  # 문장 교정 최대 개수
  max_sentence_fixes: 5

  # 음성 전사 (로컬 faster-whisper — 오디오가 외부로 나가지 않음)
  stt:
    backend: faster-whisper
    model: small            # tiny / base / small / medium / large-v3
    device: auto            # auto | cpu | cuda
    compute_type: int8      # CPU는 int8, GPU는 float16 권장
    language: en
    beam_size: 5
    vad_filter: true        # 무음 구간 제거
    verbatim_prompt: true   # filler / false start 를 지우지 않도록 유도

  # 캘리브레이션: 같은 편향 태그가 이 횟수 이상 반복돼야 판단 기준에 반영
  # (샘플 1건으로 전체 기준을 바꾸지 않기 위한 장치)
  calibration_min_repeat: 2

  # 캘리브레이션에 사용할 샘플 신뢰도
  #   A = 실제 시험 결과 확인 / B = 본인 주장 / C = 강사 모범답안
  calibration_evidence_levels:
    - A

# ──────────────────────────────────────────────
# Gmail IMAP 설정
# ──────────────────────────────────────────────
gmail:
  imap_host: imap.gmail.com
  imap_port: 993
  # 사람인/잡코리아 알림 메일 발신자 주소
  saramin_sender: info@saramin.co.kr
  jobkorea_sender: info@jobkorea.co.kr
  wanted_sender: notification@wanted.co.kr
